# РечьКонтроль + PostgreSQL 17.
#   1. В .env задайте POSTGRES_PASSWORD (только буквы и цифры, например: openssl rand -hex 24).
#   2. docker compose up -d --build
#   3. Стартовые пароли кабинета: docker compose logs app
#      или docker compose exec app cat data/initial_credentials.txt
# Оценка локальной LLM (необязательно): в .env LLM_PROVIDER=ollama, затем
#   docker compose --profile llm up -d --build
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct
# Оба порта открыты только на 127.0.0.1 этой машины.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rechkontrol
      POSTGRES_USER: rechkontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rechkontrol -d rechkontrol"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://rechkontrol:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}@db:5432/rechkontrol
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float32}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      WHISPER_BATCH_SIZE: ${WHISPER_BATCH_SIZE:-8}
      MAX_PARALLEL_JOBS: ${MAX_PARALLEL_JOBS:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-80}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-900}
      STEREO_DIARIZATION: ${STEREO_DIARIZATION:-true}
      STEREO_OPERATOR_CHANNEL: ${STEREO_OPERATOR_CHANNEL:-auto}
      LLM_WEIGHT: ${LLM_WEIGHT:-0.5}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-120}
      PII_MASKING: ${PII_MASKING:-true}
      DISPLAY_TZ: ${DISPLAY_TZ:-Europe/Moscow}
      # 152-ФЗ: срок хранения звонков в днях (0 - не удалять), шифрование расшифровок в базе.
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
      ENCRYPT_TRANSCRIPTS: ${ENCRYPT_TRANSCRIPTS:-true}
      # Ключ шифрования в отдельном томе, не рядом с данными. Со старой версии ключ
      # из data/master.key переносится сюда сам при первом запуске.
      MASTER_KEY_FILE: /app/keys/master.key
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      # ollama - сервис этой же compose-сети на этой машине, наружу текст не уходит.
      # Поэтому для него снят запрет на нелокальный адрес.
      OLLAMA_URL: http://ollama:11434
      LLM_ALLOW_REMOTE: "true"
    volumes:
      # JWT-секрет, зашифрованное аудио, модели Whisper и стартовые пароли.
      # Именованный том, а не ./data: каталог ./data Docker создал бы от root,
      # и приложение (uid 1000) не смогло бы в него писать.
      - appdata:/app/data
      # Ключ шифрования отдельно от данных: бэкап appdata без appkeys не расшифровать.
      - appkeys:/app/keys
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # порт не публикуется: Ollama доступна только приложению внутри compose-сети

volumes:
  pgdata:
    driver: local
  appdata:
    driver: local
  appkeys:
    driver: local
  ollama:
    driver: local
